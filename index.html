<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karla Pérez | IMPULSA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .contenedor {
      position: relative;
      width: 100%;
      max-width: 430px;
      background: #ffffff;
    }
    .tarjeta {
      width: 100%;
      display: block;
    }
    .link-area {
      position: absolute;
      display: block;
      z-index: 10;
      text-decoration: none;
      cursor: pointer;
    }
    .link-area::after {
      content: "";
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: rgba(189, 135, 68, 0.18);
      border: 2px solid rgba(189, 135, 68, 0.75);
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .link-area:hover::after {
      opacity: 1;
      transform: scale(1);
    }
    /* Íconos sociales */
    .whatsapp {
      left: 14%;
      top: 69%;
      width: 11%;
      height: 5%;
    }
    .instagram {
      left: 30%;
      top: 69%;
      width: 11%;
      height: 5%;
    }
    .facebook {
      left: 46%;
      top: 69%;
      width: 11%;
      height: 5%;
    }
    .tiktok {
      left: 61%;
      top: 69%;
      width: 11%;
      height: 5%;
    }
    .telefono {
      left: 77%;
      top: 69%;
      width: 11%;
      height: 5%;
    }
    /* Botón Guardar contacto */
    .guardar-contacto {
      left: 15%;
      top: 78%;
      width: 70%;
      height: 6%;
      background: transparent;
      border: none;
      padding: 0;
    }
    /* Botón Visitar IMPULSA */
    .visitar-impulsa {
      left: 15%;
      top: 86%;
      width: 70%;
      height: 6%;
    }
    .guardar-contacto::after,
    .visitar-impulsa::after {
      border-radius: 8px;
      inset: 0;
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid rgba(189, 135, 68, 0.9);
    }
    .link-area:active::after {
      opacity: 1;
      transform: scale(0.96);
    }
    @media (max-width: 600px) {
      .contenedor {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <img
      class="tarjeta"
      src="tarjeta-karla.png"
      alt="Tarjeta digital de Karla Pérez - IMPULSA"
    />
    <a
      class="link-area whatsapp"
      href="https://wa.me/50239971562"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="WhatsApp"
    ></a>
    <a
      class="link-area instagram"
      href="https://www.instagram.com/impulsa.gt/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    ></a>
    <a
      class="link-area facebook"
      href="https://www.facebook.com/ImpulsaDesarrollos"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
    ></a>
    <a
      class="link-area tiktok"
      href="https://www.tiktok.com/@impulsa.gt"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TikTok"
    ></a>
    <a
      class="link-area telefono"
      href="tel:+50239971562"
      aria-label="Llamar"
    ></a>
    <button
      class="link-area guardar-contacto"
      type="button"
      onclick="guardarContacto()"
      aria-label="Guardar contacto"
    ></button>
    <a
      class="link-area visitar-impulsa"
      href="https://impulsa.com.gt"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visitar IMPULSA"
    ></a>
  </main>
  <script>
    function guardarContacto() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Pérez;Karla;;;",
        "FN:Karla Pérez",
        "ORG:IMPULSA",
        "TITLE:Asesor de Ventas",
        "TEL;TYPE=CELL:+50239971562",
        "EMAIL;TYPE=INTERNET:kperez@impulsa.com.gt",
        "URL:https://impulsa.com.gt",
        "END:VCARD"
      ].join("\r\n");
      const archivo = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(archivo);
      enlace.download = "Karla-Perez.vcf";
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
      setTimeout(() => {
        URL.revokeObjectURL(enlace.href);
      }, 1000);
    }
  </script>
</body>
</html>
