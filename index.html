<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karla Pérez | IMPULSA</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .contenedor {
      position: relative;
      width: 100%;
      max-width: 430px;
      background: #ffffff;
    }
    .tarjeta {
      width: 100%;
      display: block;
    }
    .link-area {
      position: absolute;
      display: block;
      z-index: 10;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
      overflow: visible;
    }
    /* Destello suave solo para íconos */
    .whatsapp::after,
    .instagram::after,
    .facebook::after,
    .tiktok::after,
    .telefono::after {
      content: "";
      position: absolute;
      inset: -14px;
      opacity: 0;
      pointer-events: none;
      border-radius: 999px;
      background: radial-gradient(
        circle,
        rgba(189, 135, 68, 0.38) 0%,
        rgba(189, 135, 68, 0.18) 35%,
        rgba(189, 135, 68, 0.04) 65%,
        rgba(189, 135, 68, 0) 100%
      );
      filter: blur(3px);
      transform: scale(0.7);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .whatsapp:hover::after,
    .instagram:hover::after,
    .facebook:hover::after,
    .tiktok:hover::after,
    .telefono:hover::after {
      opacity: 1;
      transform: scale(1);
    }
    .whatsapp:active::after,
    .instagram:active::after,
    .facebook:active::after,
    .tiktok:active::after,
    .telefono:active::after {
      opacity: 1;
      transform: scale(0.9);
    }
    /* Íconos sociales */
    .whatsapp {
      left: 13.8%;
      top: 68.8%;
      width: 12%;
      height: 5.2%;
    }
    .instagram {
      left: 29.7%;
      top: 68.8%;
      width: 12%;
      height: 5.2%;
    }
    .facebook {
      left: 45.3%;
      top: 68.8%;
      width: 12%;
      height: 5.2%;
    }
    .tiktok {
      left: 60.9%;
      top: 68.8%;
      width: 12%;
      height: 5.2%;
    }
    .telefono {
      left: 76.4%;
      top: 68.8%;
      width: 12%;
      height: 5.2%;
    }
    /* Botón Guardar contacto */
    .guardar-contacto {
      left: 15%;
      top: 78%;
      width: 70%;
      height: 6.5%;
    }
    /* Botón Visitar IMPULSA */
    .visitar-impulsa {
      left: 15%;
      top: 85.9%;
      width: 70%;
      height: 6.5%;
    }
    /* Efecto limpio para botones */
    .guardar-contacto:hover,
    .visitar-impulsa:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .guardar-contacto:active,
    .visitar-impulsa:active {
      background: rgba(189, 135, 68, 0.10);
    }
    @media (max-width: 600px) {
      .contenedor {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <img
      class="tarjeta"
      src="tarjeta-karla.png"
      alt="Tarjeta digital de Karla Pérez - IMPULSA"
    />
    <a
      class="link-area whatsapp"
      href="https://wa.me/50239971562"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="WhatsApp"
    ></a>
    <a
      class="link-area instagram"
      href="https://www.instagram.com/impulsa.gt/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    ></a>
    <a
      class="link-area facebook"
      href="https://www.facebook.com/ImpulsaDesarrollos"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Facebook"
    ></a>
    <a
      class="link-area tiktok"
      href="https://www.tiktok.com/@impulsa.gt"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="TikTok"
    ></a>
    <a
      class="link-area telefono"
      href="tel:+50239971562"
      aria-label="Llamar"
    ></a>
    <button
      class="link-area guardar-contacto"
      type="button"
      onclick="guardarContacto()"
      aria-label="Guardar contacto"
    ></button>
    <a
      class="link-area visitar-impulsa"
      href="https://impulsa.com.gt"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visitar IMPULSA"
    ></a>
  </main>
  <script>
    function guardarContacto() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Pérez;Karla;;;",
        "FN:Karla Pérez",
        "ORG:IMPULSA",
        "TITLE:Asesor de Ventas",
        "TEL;TYPE=CELL:+50239971562",
        "EMAIL;TYPE=INTERNET:kperez@impulsa.com.gt",
        "URL:https://impulsa.com.gt",
        "END:VCARD"
      ].join("\r\n");
      const archivo = new Blob([vcard], {
        type: "text/vcard;charset=utf-8"
      });
      const enlace = document.createElement("a");
      enlace.href = URL.createObjectURL(archivo);
      enlace.download = "Karla-Perez.vcf";
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
      setTimeout(() => {
        URL.revokeObjectURL(enlace.href);
      }, 1000);
    }
  </script>
</body>
</html>
